# Run the app: `docker compose up --build`, then open http://localhost:3000
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      SEED_ON_START: "true"
    volumes:
      - data:/app/data
      - uploads:/app/uploads

volumes:
  data:
  uploads:
