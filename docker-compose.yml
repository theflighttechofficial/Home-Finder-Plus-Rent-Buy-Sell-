# Runs the whole stack: `docker compose up --build`, then open http://localhost:3000
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/homefinder
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      SEED_ON_START: "true"
    volumes:
      - uploads:/app/uploads

volumes:
  mongo-data:
  uploads:
