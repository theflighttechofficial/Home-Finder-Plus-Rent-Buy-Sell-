*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    background:#f3f5fa;
    padding:20px;
    transition:.3s;
}

/* DARK MODE */
body.dark{
    background:#1e1e1e;
    color:white;
}

.container{
    max-width:1100px;
    margin:auto;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 35px rgba(0,0,0,.12);
    animation:fadeIn .6s ease;
}

body.dark .container{
    background:#2a2b2d;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(15px);}
    to{opacity:1;transform:translateY(0);}
}

/* BACK BUTTON */
.back-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
    text-decoration:none;
    padding:10px 20px;
    border-radius:12px;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    font-weight:600;
    box-shadow:0 4px 20px rgba(118,75,162,.3);
    transition:.3s;
}

.back-btn:hover{
    transform:translateX(-5px);
    box-shadow:0 6px 25px rgba(118,75,162,.45);
}

/* IMAGE GALLERY */
.gallery{
    display:flex;
    overflow-x:auto;
    gap:10px;
    padding:20px;
    background:#f8f9fb;
}

.gallery img{
    height:120px;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
    object-fit:cover;
}

.gallery img:hover{
    transform:scale(1.05);
}

/* MAIN IMAGE */
.main-image{
    height:480px;
    width:100%;
    object-fit:cover;
    background:#ddd;
    cursor:pointer;
}

/* LIGHTBOX */
.lightbox{
    position:fixed;
    top:0;left:0;
    height:100%;width:100%;
    background:rgba(0,0,0,.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.lightbox img{
    max-width:90%;
    max-height:90%;
    border-radius:10px;
}

.lightbox.show{display:flex;}

/* CONTENT */
.content{
    padding:35px;
}

/* TITLE + FAVORITE */
.title-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.fav-btn{
    font-size:32px;
    cursor:pointer;
    transition:.2s;
}

.fav-btn.active{color:#ff3b3b; transform:scale(1.2);}

/* PRICE */
.price{
    font-size:34px;
    font-weight:700;
    color:#667eea;
}

/* GRID */
.details-grid{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:20px;
    background:#f8f9fa;
    padding:20px;
    border-radius:14px;
}

.detail-item span{
    display:block;
}

.detail-label{
    color:#777;
    font-size:12px;
    text-transform:uppercase;
}

.detail-value{
    font-size:20px;
    font-weight:600;
}

/* AMENITIES */
.amenities{
    margin:20px 0;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.amenity{
    padding:8px 14px;
    background:#eef2ff;
    border-radius:12px;
    font-weight:600;
}

body.dark .amenity{background:#3d3d3d;}

/* SHARE BUTTONS */
.share-row{
    margin-top:25px;
    display:flex;
    gap:10px;
}

.btn{
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    font-weight:600;
    border:none;
}

/* MAP PREVIEW */
.map-preview{
    width:100%;
    height:300px;
    border-radius:14px;
    margin-top:20px;
    background:#ddd;
}

/* DARK MODE TOGGLE */
.dark-toggle{
    position:fixed;
    top:20px;
    right:20px;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    background:black;
    color:white;
}
</style>
</head>

// URL PARAM
function getHomeIdFromURL(){
    return new URLSearchParams(window.location.search).get("id");
}

// DARK MODE
function toggleDarkMode(){
    document.body.classList.toggle("dark");
    localStorage.setItem("darkMode",document.body.classList.contains("dark"));
}

if(localStorage.getItem("darkMode")==="true"){
    document.body.classList.add("dark");
}

// LIGHTBOX
function openLightbox(src){
    document.getElementById("lightboxImg").src=src;
    document.getElementById("lightbox").classList.add("show");
}
function closeLightbox(){
    document.getElementById("lightbox").classList.remove("show");
}

// FAVORITES
function toggleFavorite(id){
    let fav=JSON.parse(localStorage.getItem("favorites")||"[]");

    if(fav.includes(id)){
        fav=fav.filter(x=>x!==id);
    }else{
        fav.push(id);
    }

    localStorage.setItem("favorites",JSON.stringify(fav));
    updateFavoriteIcon(id);
}

function updateFavoriteIcon(id){
    const icon=document.getElementById("favIcon");
    let fav=JSON.parse(localStorage.getItem("favorites")||"[]");
    icon.classList.toggle("active",fav.includes(id));
}

// SHARE
function share(home){
    const url=window.location.href;
    navigator.clipboard.writeText(url);
    alert("Link copied: " + url);
}

// LOAD PAGE
function loadHomeDetails(){
    const id=getHomeIdFromURL();
    const loading=document.getElementById("loadingMessage");
    const container=document.getElementById("homeDetails");

    const home = homesData[id];
    if(!home){ loading.innerHTML="Home not found"; return; }

    // BUILD UI
    container.innerHTML=`
        <img src="${home.images[0]}" class="main-image" onclick="openLightbox('${home.images[0]}')">

        <div class="gallery">
            ${home.images.map((img)=>`<img src="${img}" onclick="openLightbox('${img}')">`).join("")}
        </div>

        <div class="content">
            <div class="title-row">
                <h1>${home.title}</h1>
                <div class="fav-btn" id="favIcon" onclick="toggleFavorite('${id}')">❤️</div>
            </div>

            <p class="price">₹${home.rent}/month</p>

            <div class="details-grid">
                <div class="detail-item">
                    <span class="detail-label">Bedrooms</span>
                    <span class="detail-value">🛏️ ${home.bedrooms} BHK</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Bathrooms</span>
                    <span class="detail-value">🚿 ${home.bathrooms}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Parking</span>
                    <span class="detail-value">${home.parking==="yes"?"✔ Available":"❌ Not Available"}</span>
                </div>
            </div>

            <h2>Amenities</h2>
            <div class="amenities">
                ${home.amenities.map(x=>`<div class="amenity">✔ ${x}</div>`).join("")}
            </div>

            <h2>Description</h2>
            <p>${home.description}</p>

            <h2>Location</h2>
            <p>📍 ${home.location}</p>

            <iframe 
                class="map-preview"
                src="https://www.google.com/maps?q=${encodeURIComponent(home.location)}&output=embed">
            </iframe>

            <div class="share-row">
                <button class="btn" onclick='share(${JSON.stringify(home)})'>🔗 Share</button>
                <button class="btn" onclick="window.open('https://wa.me/?text=${encodeURIComponent(window.location.href)}')">💬 WhatsApp</button>
            </div>
        </div>
    `;

    updateFavoriteIcon(id);
    loading.style.display="none";
    container.style.display="block";
}

window.addEventListener("DOMContentLoaded",loadHomeDetails);
</script>
