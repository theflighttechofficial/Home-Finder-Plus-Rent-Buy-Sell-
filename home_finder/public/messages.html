<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — HomeFinder+</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #6a5af9;
    --secondary: #b833ff;
    --card: rgba(255,255,255,0.35);
    --bg: #eef1f7;
    --border: rgba(0,0,0,0.15);
}

[data-theme="dark"] {
    --bg: #121418;
    --card: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.1);
    color: white;
}

body {
    background: var(--bg);
    font-family: "Poppins", sans-serif;
}

.navbar-custom {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    padding: 1rem 2rem;
    font-size: 1.6rem;
    font-weight: 600;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

/* --- Layout --- */
.wrapper {
    display: grid;
    grid-template-columns: 28% 72%;
    height: calc(100vh - 85px);
}

/* --- Contacts Sidebar --- */
.sidebar {
    background: var(--card);
    border-right: 1px solid var(--border);
    backdrop-filter: blur(15px);
    padding: 15px;
    overflow-y: auto;
}

.contact-search {
    margin-bottom: 15px;
}

.search-input {
    border: none;
    padding: 12px 14px;
    border-radius: 12px;
    width: 100%;
    background: rgba(255,255,255,0.6);
    outline: none;
}

.contact-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
}

.contact-card:hover {
    background: rgba(255,255,255,0.2);
}

.contact-card.active {
    background: rgba(255,255,255,0.35);
}

.contact-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
}

.contact-name {
    font-weight: 600;
}

/* --- Chat Area --- */
.chat-area {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--card);
    backdrop-filter: blur(15px);
}

.chat-header {
    padding: 15px;
    font-size: 1.3rem;
    font-weight: bold;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
}

.chat-messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

/* Message bubbles */
.message {
    padding: 12px 16px;
    border-radius: 16px;
    margin-bottom: 12px;
    max-width: 70%;
    line-height: 1.4;
}

.sent {
    background: #6a5af9;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 4px;
}

.received {
    background: rgba(255,255,255,0.9);
    color: #333;
    border-bottom-left-radius: 4px;
}

/* Input box */
.chat-input {
    padding: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 12px;
}

.chat-input-box {
    flex: 1;
    border: none;
    border-radius: 16px;
    padding: 12px 15px;
    outline: none;
}

.send-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 14px;
    cursor: pointer;
    transition: 0.25s;
}

.send-btn:hover {
    transform: translateY(-3px);
}

/* Empty Chat */
.empty-chat {
    text-align: center;
    opacity: 0.7;
    margin-top: 30%;
    font-size: 1.1rem;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar-custom d-flex justify-content-between align-items-center">
    <span><i class="bi bi-chat-dots-fill me-2"></i> Messages</span>

    <a href="index.html" class="btn btn-light fw-bold">
        <i class="bi bi-arrow-left"></i> Back
    </a>
</div>

<!-- WRAPPER -->
<div class="wrapper">

    <!-- CONTACT LIST -->
    <div class="sidebar">
        <input type="text" id="contactSearch" class="search-input" placeholder="Search messages...">

        <div id="contactsList"></div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area">
        <div id="chatHeader" class="chat-header">Select a conversation</div>

        <div id="chatMessages" class="chat-messages">
            <div class="empty-chat">No chat selected</div>
        </div>

        <div class="chat-input">
            <input type="text" placeholder="Type a message..." class="chat-input-box" id="chatInput" disabled>
            <button class="send-btn" onclick="sendMessage()" disabled id="sendBtn">
                <i class="bi bi-send-fill"></i>
            </button>
        </div>
    </div>

</div>

<script>
/* -----------------------------------------
   SAMPLE CONTACTS
----------------------------------------- */
const contacts = [
    { id: 1, name: "Ravi Kumar (Home Owner)", avatar: "https://i.pravatar.cc/150?img=12" },
    { id: 2, name: "Aditi Sharma", avatar: "https://i.pravatar.cc/150?img=47" },
    { id: 3, name: "Harsh Mehta", avatar: "https://i.pravatar.cc/150?img=32" },
    { id: 4, name: "Neha Patil", avatar: "https://i.pravatar.cc/150?img=26" }
];

/* -----------------------------------------
   LOAD CONTACTS IN SIDEBAR
----------------------------------------- */
function loadContacts() {
    const container = document.getElementById("contactsList");
    container.innerHTML = "";

    contacts.forEach(c => {
        container.innerHTML += `
            <div class="contact-card" onclick="openChat(${c.id})" id="contact-${c.id}">
                <img src="${c.avatar}" class="contact-avatar">
                <div>
                    <div class="contact-name">${c.name}</div>
                    <div class="contact-last">Tap to view messages</div>
                </div>
            </div>
        `;
    });
}

loadContacts();

/* -----------------------------------------
   MESSAGE SYSTEM
----------------------------------------- */
let currentChat = null;

function openChat(id) {
    currentChat = id;

    document.querySelectorAll(".contact-card").forEach(c => c.classList.remove("active"));
    document.getElementById("contact-" + id).classList.add("active");

    const user = contacts.find(c => c.id === id);

    document.getElementById("chatHeader").innerHTML = `
        <img src="${user.avatar}" style="width:42px;height:42px;border-radius:50%;margin-right:10px;">
        ${user.name}
    `;

    loadChat(id);

    document.getElementById("chatInput").disabled = false;
    document.getElementById("sendBtn").disabled = false;
}

function loadChat(id) {
    const messages = JSON.parse(localStorage.getItem("chat-" + id) || "[]");
    const chatBox = document.getElementById("chatMessages");

    chatBox.innerHTML = "";

    messages.forEach(m => {
        chatBox.innerHTML += `
            <div class="message ${m.type}">
                ${m.text}
            </div>
        `;
    });

    chatBox.scrollTop = chatBox.scrollHeight;
}

function sendMessage() {
    if (!currentChat) return;

    const input = document.getElementById("chatInput");
    const text = input.value.trim();

    if (text === "") return;

    const key = "chat-" + currentChat;
    const messages = JSON.parse(localStorage.getItem(key) || "[]");

    messages.push({ type: "sent", text });

    localStorage.setItem(key, JSON.stringify(messages));
    input.value = "";

    loadChat(currentChat);

    setTimeout(() => autoReply(currentChat), 700);
}

/* Fake Auto Reply */
function autoReply(id) {
    const key = "chat-" + id;
    const messages = JSON.parse(localStorage.getItem(key) || "[]");

    messages.push({
        type: "received",
        text: "Thanks for your message! I will get back to you shortly."
    });

    localStorage.setItem(key, JSON.stringify(messages));
    loadChat(id);
}

/* -----------------------------------------
   SEARCH CONTACTS
----------------------------------------- */
document.getElementById("contactSearch").addEventListener("input", function() {
    const val = this.value.toLowerCase();

    contacts.forEach(c => {
        const card = document.getElementById("contact-" + c.id);
        card.style.display = c.name.toLowerCase().includes(val) ? "flex" : "none";
    });
});
</script>

</body>
</html>
