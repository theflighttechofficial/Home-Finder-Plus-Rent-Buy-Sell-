<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — HomeFinder+</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
    background: #f4f6fb;
    font-family: "Poppins", sans-serif;
}

.settings-container {
    max-width: 750px;
    margin: 40px auto;
    background: white;
    padding: 25px 35px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    animation: fadeIn .5s ease;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}

.section-title {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 20px 0 10px;
}

.option-row {
    display: flex;
    justify-content: space-between;
    padding: 14px 12px;
    background: #f0f2f8;
    border-radius: 12px;
    margin-bottom: 10px;
    align-items: center;
}

.option-row:hover {
    background: #e6e8ee;
}

.option-name {
    font-size: 1rem;
    font-weight: 500;
}

select, .form-check-input {
    cursor: pointer;
}

.reset-btn {
    background: #ff4c4c;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 600;
    transition: 0.2s;
}

.reset-btn:hover {
    background: #d83737;
}

.back-btn {
    margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">
    <a href="index.html" class="btn btn-secondary back-btn"><i class="bi bi-arrow-left"></i> Back</a>

    <div class="settings-container">

        <h2 class="text-center mb-4"><i class="bi bi-gear-fill"></i> Settings</h2>


        <!-- THEME SETTINGS -->
        <div class="section-title">Theme</div>

        <div class="option-row">
            <div class="option-name">App Theme</div>
            <select id="themeSelect" class="form-select w-50">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="auto">Auto (Follow System)</option>
            </select>
        </div>


        <!-- CARD SIZE -->
        <div class="section-title">Display Options</div>

        <div class="option-row">
            <div class="option-name">Card Size</div>
            <select id="cardSize" class="form-select w-50">
                <option value="compact">Compact</option>
                <option value="normal">Comfortable</option>
                <option value="large">Large</option>
            </select>
        </div>


        <div class="option-row">
            <div class="option-name">Animations</div>
            <div>
                <input class="form-check-input" type="checkbox" id="animationsToggle">
                <label for="animationsToggle" class="ms-2">Enable</label>
            </div>
        </div>


        <div class="option-row">
            <div class="option-name">Reduced Motion (Accessibility)</div>
            <div>
                <input class="form-check-input" type="checkbox" id="reduceMotionToggle">
                <label for="reduceMotionToggle" class="ms-2">Enable</label>
            </div>
        </div>


        <!-- RESET -->
        <div class="section-title">Reset</div>

        <div class="option-row">
            <div class="option-name text-danger">Reset All Settings</div>
            <button class="reset-btn" onclick="resetAllSettings()">
                <i class="bi bi-trash"></i> Reset
            </button>
        </div>

    </div>
</div>

<script>
/* ================================
   LOAD SETTINGS FROM LOCALSTORAGE
=================================== */
function loadSettings() {
    document.getElementById("themeSelect").value =
        localStorage.getItem("appTheme") || "light";

    document.getElementById("cardSize").value =
        localStorage.getItem("cardSize") || "normal";

    document.getElementById("animationsToggle").checked =
        localStorage.getItem("animations") !== "off";

    document.getElementById("reduceMotionToggle").checked =
        localStorage.getItem("reduceMotion") === "on";

    applyTheme();
}

function applyTheme() {
    const theme = localStorage.getItem("appTheme") || "light";

    if (theme === "auto") {
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", prefersDark ? "dark" : "light");
    } else {
        document.documentElement.setAttribute("data-theme", theme);
    }
}

/* ================================
   SAVE SETTINGS
=================================== */
document.getElementById("themeSelect").addEventListener("change", e => {
    localStorage.setItem("appTheme", e.target.value);
    applyTheme();
});

document.getElementById("cardSize").addEventListener("change", e => {
    localStorage.setItem("cardSize", e.target.value);
});

document.getElementById("animationsToggle").addEventListener("change", e => {
    localStorage.setItem("animations", e.target.checked ? "on" : "off");
});

document.getElementById("reduceMotionToggle").addEventListener("change", e => {
    localStorage.setItem("reduceMotion", e.target.checked ? "on" : "off");
});


/* RESET SETTINGS */
function resetAllSettings() {
    if (!confirm("Reset all settings to default?")) return;

    localStorage.removeItem("appTheme");
    localStorage.removeItem("cardSize");
    localStorage.removeItem("animations");
    localStorage.removeItem("reduceMotion");

    alert("All settings reset!");
    location.reload();
}


/* INITIALIZE */
loadSettings();
</script>

</body>
</html>
