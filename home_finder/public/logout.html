<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logout — HomeFinder+</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --primary:#6a5af9;
    --secondary:#b833ff;
    --bg:#f4f6fb;
    --card:#ffffff;
}

[data-theme="dark"]{
    --bg:#1d1f23;
    --card:#2b2d31;
    color:white;
}

body{
    background:var(--bg);
    font-family:"Poppins",sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.logout-box{
    width:360px;
    background:var(--card);
    padding:35px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
    text-align:center;
    animation:fadeIn .7s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

.logout-icon{
    font-size:68px;
    color:var(--primary);
    animation:pulse 1.6s infinite ease;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.12);}
    100%{transform:scale(1);}
}

.logout-title{
    font-size:28px;
    font-weight:600;
    margin-top:20px;
}

.logout-text{
    margin:10px 0 25px;
    color:#666;
}

.btn-logout{
    width:100%;
    padding:12px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:white;
    font-weight:600;
    font-size:16px;
    transition:.3s;
}

.btn-logout:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
}

.cancel-link{
    display:block;
    margin-top:15px;
    text-decoration:none;
    font-weight:600;
    color:var(--primary);
    transition:.2s;
}

.cancel-link:hover{
    color:#533df7;
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="logout-box">
    <i class="bi bi-box-arrow-right logout-icon"></i>

    <div class="logout-title">Log Out?</div>
    <p class="logout-text">Are you sure you want to sign out of your HomeFinder+ account?</p>

    <button class="btn-logout" onclick="logoutUser()">Log Out</button>

    <a href="index.html" class="cancel-link">Cancel</a>
</div>

<script>
function logoutUser(){
    // Remove stored user/session data
    localStorage.removeItem("loggedInUser");
    localStorage.removeItem("favourites");

    // Redirect to login page or homepage
    window.location.href = "login.html";
}
</script>

</body>
</html>
