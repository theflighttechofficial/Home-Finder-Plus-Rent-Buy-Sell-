<!doctype html>
<html data-page="favorites">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Favorites — HomeFinder+</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f4f6fb;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 12px;
      font-size: 1.4rem;
      font-weight: 700;
    }

    /* Favourite Cards */
    .fav-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      transition: 0.3s ease;
      cursor: pointer;
    }

    .fav-card:hover {
      transform: translateY(-6px);
    }

    .fav-image {
      height: 180px;
      width: 100%;
      object-fit: cover;
    }

    .remove-btn {
      background: #ff3b3b;
      border: none;
      color: white;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 14px;
      transition: 0.2s ease;
    }

    .remove-btn:hover {
      background: #c62828;
    }

    .empty-box {
      padding: 60px 20px;
      text-align: center;
      opacity: 0.8;
    }

    .empty-box img {
      width: 220px;
      margin-bottom: 14px;
    }
  </style>
</head>

<body data-theme="light">

  <!-- NAV -->
  <div class="navbar container">
    <div class="brand"><i class="bi bi-heart-fill text-danger me-2"></i> Favorites</div>
    <div class="controls">
      <a class="btn btn-secondary" href="index.html"><i class="bi bi-arrow-left"></i> Back</a>
    </div>
  </div>

  <div class="container">
    <h3 class="mt-3 mb-3">Saved Favorites</h3>
    <div id="favoritesContainer"></div>
  </div>


  <!-- Load datasets -->
  <script src="assets/homes.js"></script>

  <script>
    /* 
     * homesData → Loaded from assets/homes.js
     * favouriteHouses → Stored in localStorage
     */

    function loadFavorites() {
        const container = document.getElementById("favoritesContainer");
        container.innerHTML = "";

        let favs = JSON.parse(localStorage.getItem("favourites")) || [];

        // No favourites?
        if (favs.length === 0) {
            container.innerHTML = `
                <div class="empty-box">
                    <img src="https://cdn-icons-png.flaticon.com/512/4076/4076500.png">
                    <h4>No Favorites Yet</h4>
                    <p>Start saving properties you like!</p>
                </div>
            `;
            return;
        }

        // Map IDs -> home objects
        const favHomes = homesData.filter(home => favs.includes(home.id));

        favHomes.forEach(home => {
            const card = document.createElement("div");
            card.className = "fav-card";

            card.innerHTML = `
              <img src="${home.img}" class="fav-image" onclick="openDetails(${home.id})">

              <div class="p-3">
                 <h5>${home.title}</h5>
                 <p class="mb-1">⭐ ${home.rating} | ${home.bhk} BHK • ₹${home.rent}/month</p>
                 <p class="text-muted">${home.tag}</p>

                 <button class="remove-btn mt-2" onclick="removeFavorite(${home.id})">
                    <i class="bi bi-trash"></i> Remove
                 </button>
              </div>
            `;

            container.appendChild(card);
        });
    }

    function openDetails(id) {
        window.location.href = `details.html?id=${id}`;
    }

    function removeFavorite(id) {
        let favs = JSON.parse(localStorage.getItem("favourites")) || [];
        favs = favs.filter(x => x !== id);

        localStorage.setItem("favourites", JSON.stringify(favs));
        loadFavorites(); // Refresh UI
    }

    // Load favourites on page load
    window.onload = loadFavorites;
  </script>

</body>
</html>
