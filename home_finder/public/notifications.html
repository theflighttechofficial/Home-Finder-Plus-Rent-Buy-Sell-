<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — HomeFinder+</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --primary:#6a5af9;
    --secondary:#b833ff;
    --card:rgba(255,255,255,0.4);
    --border:rgba(255,255,255,0.25);
    --bg:#eef1f7;
}

[data-theme="dark"]{
    --bg:#121418;
    --card:rgba(255,255,255,0.06);
    --border:rgba(255,255,255,0.1);
    color:white;
}

body{
    background:var(--bg);
    font-family:"Poppins",sans-serif;
    padding-bottom:40px;
}

/* NAVBAR */
.navbar-custom{
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:white;
    font-size:1.6rem;
    font-weight:600;
    padding:1rem 2rem;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);
}

/* NOTIFICATION CARD */
.notify-card{
    background:var(--card);
    border:1px solid var(--border);
    backdrop-filter:blur(15px);
    padding:18px;
    border-radius:16px;
    display:flex;
    gap:18px;
    align-items:flex-start;
    margin-bottom:15px;
    animation:pop .35s ease;
    transition:.3s;
}

@keyframes pop{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

.notify-card:hover{
    transform:translateY(-5px);
}

/* ICON */
.notify-icon{
    font-size:30px;
    padding:12px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:white;
    box-shadow:0 5px 18px rgba(0,0,0,0.2);
}

/* TEXT */
.notify-title{
    font-size:1.1rem;
    font-weight:600;
}

.notify-time{
    font-size:.8rem;
    opacity:.7;
}

/* UNREAD BADGE */
.unread-dot{
    width:12px;
    height:12px;
    background:#ff3b3b;
    border-radius:50%;
    margin-left:auto;
    margin-top:5px;
}

/* TOP CONTROLS */
.page-actions{
    display:flex;
    justify-content:space-between;
    margin:20px 0;
}

.btn-clear{
    background:#ff3b3b;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:10px;
    font-weight:600;
}

.btn-read{
    background:#6a5af9;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:10px;
    font-weight:600;
}

/* EMPTY STATE */
.empty-state{
    text-align:center;
    margin-top:50px;
}

.empty-state img{
    width:250px;
    opacity:.85;
}

.empty-state h3{
    font-weight:600;
    margin-top:15px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar-custom d-flex justify-content-between align-items-center">
    <span><i class="bi bi-bell-fill me-2"></i> Notifications</span>

    <a href="index.html" class="btn btn-light fw-bold">
        <i class="bi bi-arrow-left"></i> Back
    </a>
</div>

<div class="container mt-3">

    <div class="page-actions">
        <button class="btn-read" onclick="markAllRead()">Mark All as Read</button>
        <button class="btn-clear" onclick="clearAll()">Clear All</button>
    </div>

    <div id="notificationsList"></div>

    <div id="emptyState" class="empty-state d-none">
        <img src="https://cdn-icons-png.flaticon.com/512/4076/4076500.png">
        <h3>No Notifications</h3>
        <p>You are all caught up!</p>
    </div>

</div>

<script>
/* ---------------------------------------------------
   LOAD NOTIFICATIONS
--------------------------------------------------- */
function getNotifications(){
    return JSON.parse(localStorage.getItem("notifications") || "[]");
}

function saveNotifications(list){
    localStorage.setItem("notifications", JSON.stringify(list));
}

/* ---------------------------------------------------
   RENDER NOTIFICATIONS
--------------------------------------------------- */
function renderNotifications(){
    const list = getNotifications();
    const container = document.getElementById("notificationsList");
    const empty = document.getElementById("emptyState");

    container.innerHTML = "";

    if(list.length === 0){
        empty.classList.remove("d-none");
        return;
    }

    empty.classList.add("d-none");

    list.forEach((note, idx) => {
        container.innerHTML += `
            <div class="notify-card">
                <div class="notify-icon">
                    <i class="bi ${note.icon}"></i>
                </div>

                <div style="flex:1">
                    <div class="notify-title">${note.title}</div>
                    <div class="notify-text">${note.message}</div>
                    <div class="notify-time">${note.time}</div>
                </div>

                ${note.read ? "" : "<div class='unread-dot'></div>"}
            </div>
        `;
    });
}

/* ---------------------------------------------------
   UPDATE FUNCTIONS
--------------------------------------------------- */
function markAllRead(){
    let list = getNotifications();
    list = list.map(n => ({...n, read:true}));
    saveNotifications(list);
    renderNotifications();
}

function clearAll(){
    if (!confirm("Delete all notifications?")) return;
    saveNotifications([]);
    renderNotifications();
}

/* ---------------------------------------------------
   AUTO-SEED SAMPLE NOTIFICATIONS (only once)
--------------------------------------------------- */
if(!localStorage.getItem("notifications")){
    saveNotifications([
        {
            title:"New Home Recommendation",
            message:"A new 2BHK in Hyderabad matches your filters.",
            time:"Just now",
            icon:"bi-house-heart-fill",
            read:false
        },
        {
            title:"Price Drop Alert",
            message:"Bangalore 3BHK rent dropped from 25k → 22k!",
            time:"5 min ago",
            icon:"bi-cash-coin",
            read:false
        },
        {
            title:"Listing Approved",
            message:"Your posted listing was published successfully.",
            time:"Yesterday",
            icon:"bi-check-circle-fill",
            read:true
        }
    ]);
}

renderNotifications();

</script>

</body>
</html>
