<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Messages — HomeFinder+</title>
    <meta name="description" content="Your conversations with owners and buyers.">
    <meta name="theme-color" content="#5b4cf0">
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/theme.js"></script>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main class="page" style="padding:24px 0">
    <div class="container">
        <div class="card chat" id="chat">
            <div class="chat-list">
                <div class="head">
                    <h2 class="mb-1" style="font-size:1.3rem">Messages</h2>
                    <div class="input-group"><i data-icon="search"></i><input class="input" id="search" type="search" placeholder="Search conversations" aria-label="Search conversations"></div>
                </div>
                <div class="items" id="convos"></div>
            </div>
            <div class="chat-main" id="main"></div>
        </div>
    </div>
</main>
<script type="module" src="/js/pages/messages.js"></script>
</body>
</html>
