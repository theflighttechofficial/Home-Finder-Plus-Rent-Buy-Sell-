<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications — HomeFinder+</title>
    <meta name="description" content="Your HomeFinder+ notifications.">
    <meta name="theme-color" content="#5b4cf0">
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/theme.js"></script>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main class="page">
    <div class="container container-sm">
        <div class="page-head">
            <div><h1>Notifications</h1><p id="sub">Stay on top of messages and activity on your listings.</p></div>
            <div class="row">
                <button class="btn btn-sm" id="read-all"><i data-icon="check"></i> Mark all read</button>
                <button class="btn btn-sm btn-ghost" id="clear-all"><i data-icon="trash"></i> Clear</button>
            </div>
        </div>
        <div class="tabs" role="tablist" id="tabs">
            <button role="tab" data-filter="all" aria-selected="true">All</button>
            <button role="tab" data-filter="unread" aria-selected="false">Unread</button>
            <button role="tab" data-filter="message" aria-selected="false">Messages</button>
            <button role="tab" data-filter="favourite" aria-selected="false">Saves</button>
        </div>
        <div class="card" id="list"></div>
    </div>
</main>
<footer id="site-footer"></footer>
<script type="module" src="/js/pages/notifications.js"></script>
</body>
</html>
